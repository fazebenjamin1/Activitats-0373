<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Exerici 28</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <main class="carta-grid">
            <article class="tarjeta">
                <img src="https://picsum.photos/400/300?1" alt="Café espresso en taza blanca">
                <div class="tarjeta-info">
                    <h3>Espresso</h3>
                    <p>Intenso y aromático, con notas de chocolate.</p>
                    <p class="precio">3,50 €</p>
                </div>
            </article>
            <article class="tarjeta">
                <img src="https://picsum.photos/400/300?2" alt="Capuchino con espuma decorada">
                <div class="tarjeta-info">
                    <h3>Capuchino</h3>
                    <p>Espresso con leche cremosa y espuma suave, ideal para acompañar el desayuno de cada mañana.</p>
                    <p class="precio">4,00 €</p>
                </div>
            </article>
            <article class="tarjeta">
                <img src="https://picsum.photos/400/300?3" alt="Té verde con hojas frescas">
                <div class="tarjeta-info">
                    <h3>Té verde</h3>
                    <p>Infusión ligera de hojas seleccionadas.</p>
                    <p class="precio">2,80 €</p>
                </div>
            </article>
        </main>
    </body>
</html>
